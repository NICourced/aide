name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # У действия по умолчанию `packages: tools platform-tools`, но пакета `tools`
          # в репозитории SDK больше нет: установка падает с "Failed to find package 'tools'"
          # и роняет job за 20 секунд. Нужный набор ставится шагом ниже, поэтому здесь
          # из умолчания убран только исчезнувший пакет.
          packages: platform-tools

      - name: Лицензии Android SDK
        run: yes | sdkmanager --licenses

      - name: Платформа и инструменты Android
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Юнит-тесты
        # :desktopApp:test — сквозная проверка этапа (T-0.15): тот же App, настоящий
        # EmbeddedHost и настоящее WebSocket-соединение. Без этой задачи в списке
        # главное доказательство приёмки этапа не запускалось бы нигде.
        run: ./gradlew :domain:jvmTest :protocol:jvmTest :host-core:test :host-agent:test :host-tools:test :client-state:jvmTest :client-ui:jvmTest :desktopApp:test

      - name: Сквозной тест этапа действительно исполнился
        # Тест, который не запускается, не существует. Эта проверка превращает
        # «забыли добавить задачу в список» из незаметного в красную сборку.
        run: test -f desktopApp/build/test-results/test/TEST-dev.aide.desktop.DesktopEndToEndTest.xml

      - name: Объявленные тесты действительно исполнились
        # JUnit 5 молча игнорирует @Test, возвращающий не-void (например, тело вида
        # `fun x() = runBlocking { … assertIs<…>() }`), а отчёт остаётся зелёным —
        # класс дефекта из AGENTS.md, который в этапе 0 стоил пропавшего теста.
        # Проверка сравнивает число @Test в исходниках модуля с числом <testcase>
        # в его отчёте и валит сборку при расхождении.
        # Учитываются только конфигурации, которые гоняет этот job: `jvmTest`
        # у KMP-модулей и `test` у JVM-модулей. Android-конфигурации
        # (testDebugUnitTest/testReleaseUnitTest) пишут в другой каталог и при
        # подсчёте по всему `build/test-results` удвоили бы счёт.
        run: |
          fail=0
          check() {
            module="$1"; results="$2"; shift 2
            declared=0
            for set in "$@"; do
              [ -d "$module/src/$set" ] || continue
              n=$(grep -rho '@Test' "$module/src/$set" --include='*.kt' | wc -l | tr -d '[:space:]')
              declared=$((declared + n))
            done
            executed=0
            for report in "$module/build/test-results/$results"/TEST-*.xml; do
              [ -e "$report" ] || continue
              n=$(grep -o 'tests="[0-9]*"' "$report" | head -1 | sed 's/[^0-9]//g')
              executed=$((executed + n))
            done
            echo "$module: объявлено @Test = $declared, исполнено <testcase> = $executed"
            if [ "$declared" -ne "$executed" ]; then
              echo "::error::$module: объявлено $declared тестов, исполнено $executed — часть тестов не запустилась"
              fail=1
            fi
          }
          check domain       jvmTest commonTest jvmTest
          check protocol     jvmTest commonTest jvmTest
          check host-core    test    test
          check host-agent   test    test
          check host-tools   test    test
          check client-state jvmTest commonTest jvmTest
          check client-ui    jvmTest commonTest jvmTest
          check desktopApp   test    test
          exit $fail

      - name: Линт
        run: ./gradlew detekt

      - name: Тесты логики сборки
        run: ./gradlew -p build-logic test

      - name: Границы модулей
        run: ./gradlew verifyModuleBoundaries

      - name: Документация домена
        run: ./gradlew :domain:dokkaGenerate

      - name: Сборка Android
        run: ./gradlew :androidApp:assembleDebug

      - name: Сборка десктопа
        run: ./gradlew :desktopApp:createDistributable

      - name: Бюджет времени прогона
        run: echo "Прогон без кэша не должен превышать 15 минут — ограничение задано job.timeout-minutes"

  # Windows-дистрибутив Compose Desktop с Linux не собрать: `compose.desktop.currentOs`
  # подставляет артефакты хоста. Поэтому Windows собирается на своём раннере —
  # этот job и закрывает требование «Linux и Windows» из T-0.2.
  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка десктопа под Windows
        shell: bash
        run: ./gradlew :desktopApp:createDistributable

      - name: Тесты JVM-модулей под Windows
        shell: bash
        run: ./gradlew :client-ui:jvmTest :client-state:jvmTest
